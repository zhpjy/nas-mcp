services:
  nas-mcp:
    build: .
    image: nas-mcp:local
    container_name: nas-mcp
    restart: unless-stopped
    init: true
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      # 容器内以 uid 10001 运行；config.yaml 需要对该用户可读，例如 chmod 644。
      # 如果使用宿主机用户运行容器，可以改为 600 并设置 user。
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      # qBittorrent 在宿主机上时，config.yaml 中的 qbittorrent.url
      # 要改成 http://host.docker.internal:8080（容器内的 127.0.0.1 是容器自己）
      - "host.docker.internal:host-gateway"
    ports:
      # 只绑定本机，前面用带认证的反向代理暴露；局域网直连改成 "8000:8000"
      - "127.0.0.1:8000:8000"
