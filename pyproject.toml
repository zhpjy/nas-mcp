[project]
name = "nas-mcp"
version = "0.2.4"
description = "MCP server for searching PT torrents and pushing them to qBittorrent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.10",
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
    "starlette>=0.27",
    "uvicorn>=0.31.1",
]

[project.scripts]
nas-mcp = "nas_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nas_mcp"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文文案会触发全角标点告警，项目内统一使用中文标点。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
